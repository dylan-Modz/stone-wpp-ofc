name: Stone WPP - testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - name: Código
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validar sintaxe
        run: find lib/Recursos lib/Store lib/Plugins -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Rodar testes
        run: npm test
